[project]
name = "plws"
version = "0.1.0"
description = "PLWS reasoning-window research with frozen PUMA/DEER baselines"
requires-python = ">=3.11"
dependencies = [
  "transformers>=4.51.0,<5",
  "datasets",
  "tqdm",
  "torch",
  "numpy",
  "matplotlib",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plws", "attn_early_exit"]
